name: Daily Research Job Alert Check

on:
  schedule:
    # Runs every day at 07:00 UTC (10:00 AM Greek Time)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python job_scrapper.py

      - name: Commit updated seen_jobs.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.txt
          git commit -m "Update seen_jobs.txt [skip ci]" || echo "No new jobs to commit"
          git push origin main || echo "Nothing to push"